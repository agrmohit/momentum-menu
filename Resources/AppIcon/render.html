<!doctype html>
<!-- Draws one icon at px x px in the centre of the window, for headless Chrome
     to screenshot and render.sh to crop out (sips crops around the centre).
     render.html?id=Starfield&art=large&shape=fullbleed&px=128
     id=Volume draws the DMG's volume icon (no art or shape). id=Background
     fills the window with the DMG background, sized by width, height, appX,
     applicationsX and iconY (no px), which render.sh takes from layout.json.
     The window stays 1024 wide: headless Chrome screenshots some small
     windows (100-140 px) blank. -->
<html><head><meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; overflow: hidden; } svg { display: block; }</style>
<script src="artwork.js"></script>
</head><body>
<script>
  const query = new URLSearchParams(location.search);
  const id = query.get("id");
  // Number() rejects trailing junk that parseInt would drop.
  const whole = name => {
    const n = Number(query.get(name));
    if (!Number.isInteger(n) || n < 1 || n > 2048) throw new Error(`${name} must be 1...2048: ${query.get(name)}`);
    return n;
  };
  if (id === "Background") {
    const layout = Object.fromEntries(["width", "height", "appX", "applicationsX", "iconY"].map(k => [k, whole(k)]));
    document.body.innerHTML = `<div style="width:${layout.width}px;height:${layout.height}px">${dmgBackgroundSVG(layout)}</div>`;
  } else {
    const px = whole("px");
    if (px > 1024) throw new Error(`px must be 1...1024: ${px}`);
    const inset = (1024 - px) / 2;
    const svg = id === "Volume" ? volumeSVG() : iconSVG(id, query.get("art"), query.get("shape"));
    document.body.innerHTML = `<div style="position:absolute;left:${inset}px;top:${inset}px;width:${px}px;height:${px}px">${svg}</div>`;
  }
</script>
</body></html>
