# Builds a DMG for a pushed v* tag, attests where it came from, and publishes
# the release, once CI has passed on the tagged commit. The app is ad hoc
# signed, not notarised: the attestation is what lets a download be checked
# against this repo and commit.
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; the release job raises what it needs.
permissions:
  contents: read

# One publish per tag at a time, never cancelled halfway through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: macos-26
    permissions:
      contents: write           # create the release
      id-token: write           # Sigstore certificate for the attestation
      attestations: write       # store the attestation
      artifact-metadata: write  # the attestation's storage record
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches build.sh and has notes
        run: make release-check TAG="$GITHUB_REF_NAME"

      - name: Build the DMG and its checksum
        run: make dmg

      # Before the release exists, so no release is ever public unattested.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: build/MomentumMenu-*.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/MomentumMenu-*.dmg build/MomentumMenu-*.dmg.sha256 \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
